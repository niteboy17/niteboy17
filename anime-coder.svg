  <g class="code-scroll">
    <text x="192" y="143" font-size="9" font-family="monospace"><tspan fill="#c792ea">import</tspan><tspan fill="#89ddff"> React, </tspan><tspan fill="#c792ea">{ useState }</tspan><tspan fill="#89ddff"> from </tspan><tspan fill="#c3e88d">'react'</tspan><tspan fill="#89ddff">;</tspan></text>
    <text x="192" y="155" font-size="9" font-family="monospace"><tspan fill="#c792ea">import</tspan><tspan fill="#89ddff"> axios </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#c3e88d"> 'axios'</tspan><tspan fill="#89ddff">;</tspan></text>
    <text x="192" y="167" font-size="9" font-family="monospace"><tspan fill="#546e7a">// Thinkboard — note CRUD</tspan></text>
    <text x="192" y="179" font-size="9" font-family="monospace"><tspan fill="#c792ea">const</tspan><tspan fill="#eeffff"> </tspan><tspan fill="#82aaff">NoteApp</tspan><tspan fill="#eeffff"> = () </tspan><tspan fill="#89ddff">=></tspan><tspan fill="#eeffff"> {</tspan></text>
    <text x="192" y="191" font-size="9" font-family="monospace"><tspan fill="#eeffff">  </tspan><tspan fill="#c792ea">const</tspan><tspan fill="#eeffff"> [notes, setNotes] = </tspan><tspan fill="#82aaff">useState</tspan><tspan fill="#eeffff">([]);</tspan></text>
    <text x="192" y="203" font-size="9" font-family="monospace"><tspan fill="#eeffff">  </tspan><tspan fill="#c792ea">const</tspan><tspan fill="#eeffff"> [input, setInput] = </tspan><tspan fill="#82aaff">useState</tspan><tspan fill="#eeffff">(</tspan><tspan fill="#c3e88d">''</tspan><tspan fill="#eeffff">);</tspan></text>
    <text x="192" y="215" font-size="9" font-family="monospace"><tspan fill="#eeffff">  </tspan><tspan fill="#c792ea">const</tspan><tspan fill="#eeffff"> </tspan><tspan fill="#82aaff">addNote</tspan><tspan fill="#eeffff"> = </tspan><tspan fill="#c792ea">async</tspan><tspan fill="#eeffff"> () </tspan><tspan fill="#89ddff">=></tspan><tspan fill="#eeffff"> {</tspan></text>
    <text x="192" y="227" font-size="9" font-family="monospace"><tspan fill="#eeffff">    </tspan><tspan fill="#c792ea">await</tspan><tspan fill="#eeffff"> axios.</tspan><tspan fill="#82aaff">post</tspan><tspan fill="#eeffff">(</tspan><tspan fill="#c3e88d">'/api/notes'</tspan><tspan fill="#eeffff">, {input});</tspan></text>
    <text x="192" y="239" font-size="9" font-family="monospace"><tspan fill="#eeffff">    </tspan><tspan fill="#82aaff">setNotes</tspan><tspan fill="#eeffff">([...notes, input]);</tspan></text>
    <text x="192" y="251" font-size="9" font-family="monospace"><tspan fill="#eeffff">  };</tspan></text>
    <text x="192" y="263" font-size="9" font-family="monospace"><tspan fill="#eeffff">  </tspan><tspan fill="#c792ea">return</tspan><tspan fill="#eeffff"> (</tspan></text>
    <text x="192" y="275" font-size="9" font-family="monospace"><tspan fill="#eeffff">    </tspan><tspan fill="#89ddff">&lt;</tspan><tspan fill="#f07178">div</tspan><tspan fill="#c792ea"> className</tspan><tspan fill="#89ddff">=</tspan><tspan fill="#c3e88d">"app"</tspan><tspan fill="#89ddff">&gt;</tspan></text>
    <text x="192" y="287" font-size="9" font-family="monospace"><tspan fill="#eeffff">      </tspan><tspan fill="#89ddff">&lt;</tspan><tspan fill="#f07178">input</tspan><tspan fill="#c792ea"> value</tspan><tspan fill="#89ddff">={</tspan><tspan fill="#eeffff">input</tspan><tspan fill="#89ddff">}</tspan><tspan fill="#eeffff"> /></tspan></text>
    <text x="192" y="313" font-size="9" font-family="monospace"><tspan fill="#c792ea">import</tspan><tspan fill="#89ddff"> React, </tspan><tspan fill="#c792ea">{ useState }</tspan><tspan fill="#89ddff"> from </tspan><tspan fill="#c3e88d">'react'</tspan><tspan fill="#89ddff">;</tspan></text>
    <text x="192" y="325" font-size="9" font-family="monospace"><tspan fill="#c792ea">import</tspan><tspan fill="#89ddff"> axios </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#c3e88d"> 'axios'</tspan><tspan fill="#89ddff">;</tspan></text>
