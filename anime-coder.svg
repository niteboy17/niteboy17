<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<defs>
  <style>
    .star1{animation:twinkle 2.5s ease-in-out infinite;}
    .star2{animation:twinkle 3.1s ease-in-out infinite 0.8s;}
    .star3{animation:twinkle 2.2s ease-in-out infinite 1.4s;}
    @keyframes twinkle{0%,100%{opacity:0.9;}50%{opacity:0.15;}}
    .code-scroll{animation:codeScroll 6s linear infinite;}
    @keyframes codeScroll{0%{transform:translateY(0);}100%{transform:translateY(-80px);}}
    .cursor{animation:blink 0.7s step-end infinite;}
    @keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}
    .cs1{animation:steam 2.2s ease-in-out infinite;}
    .cs2{animation:steam 2.2s ease-in-out infinite 0.9s;}
    .cs3{animation:steam 2.2s ease-in-out infinite 1.6s;}
    @keyframes steam{0%,100%{opacity:0;transform:translateY(0);}40%{opacity:0.55;transform:translateY(-14px);}80%{opacity:0;transform:translateY(-26px);}}
    .sglow{animation:glowPulse 3s ease-in-out infinite;}
    @keyframes glowPulse{0%,100%{opacity:0.18;}50%{opacity:0.30;}}
    .notify{animation:notifPop 5s ease-in-out infinite 2s;}
    @keyframes notifPop{0%,15%,100%{opacity:0;transform:translateY(6px);}20%,80%{opacity:1;transform:translateY(0);}85%{opacity:0;transform:translateY(-4px);}}
    .tabblink{animation:tabActive 4s ease-in-out infinite;}
    @keyframes tabActive{0%,100%{fill:#1f2d3d;}48%{fill:#1f2d3d;}52%{fill:#253545;}56%{fill:#1f2d3d;}}
  </style>
  <clipPath id="screenArea">
    <rect x="188" y="130" width="322" height="166"/>
  </clipPath>
